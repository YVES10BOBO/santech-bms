services:
  - type: web
    name: santech-bms-api
    env: node
    rootDir: backend
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm run build && pnpm exec prisma generate && pnpm exec prisma migrate deploy
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://santech-bms.vercel.app
